name = "pdfpro-proxy"
main = "src/index.ts"
# The Balzo account; the token can see three, and a deploy has to say which.
account_id = "c9b26d1da215e6a682afb7d5a3d92fb9"
compatibility_date = "2025-01-15"

# Secrets — set with `wrangler secret put <NAME>`, never in this file:
#   OPENAI_API_KEY      the OpenAI key that used to be compiled into the app
#   STIRLING_API_KEY    from a Stirling account at stirling.com; sent as X-API-KEY
#   APPLE_PRIVATE_KEY   the .p8 from App Store Connect (Keys → In-App Purchase),
#                       pasted whole, BEGIN/END lines included

[vars]
# Firebase project *numbers* (not the ids): the App Check token's issuer and
# audience are built from them. Production first, then staging — each is the
# GCM_SENDER_ID in that build's GoogleService-Info.plist. Both are listed because
# the two builds are two apps to Firebase and mint their own tokens.
FIREBASE_PROJECT_NUMBERS = "950539290225,971070997447"
# App Store Connect key identifiers that go with APPLE_PRIVATE_KEY. Identifiers,
# not credentials: they say which key signed and which account it belongs to,
# and open nothing on their own. The key itself is a secret and is not in here.
APPLE_KEY_ID = "9GGD2848L3"
APPLE_ISSUER_ID = "69a6de72-72bc-47e3-e053-5b8c7c11a4d1"
# Both bundle ids are accepted so the staging build can use the same worker.
# The other half of that is FIREBASE_PROJECT_NUMBERS above: a build has to be
# named in both lists to get through, since one says which app Apple will vouch
# for and the other says which Firebase project may have attested it.
APPLE_BUNDLE_IDS = "eu.balzo.pdfexpert,eu.balzo.pdfexpert.staging"
# Where Stirling-PDF actually lives: their own hosted API, which turns out to
# exist and to run the same software. `/api/v1/info/status` there answers
# {"version":"2.14.1","status":"UP"}, `/v1/api-docs` declares X-API-KEY as its
# scheme, and all seven paths this worker calls are in that spec. Still no
# default in the code: a wrong host here would send documents somewhere nobody
# chose.
STIRLING_BASE_URL = "https://api.stirling.com"
# Per-subscriber ceilings, per calendar month.
CHAT_MONTHLY_LIMIT = "20"
STIRLING_MONTHLY_LIMIT = "50"
# Rough ceiling per IP per minute, as a backstop against scripted traffic.
IP_RATE_LIMIT = "30"

# Created with `wrangler kv namespace create LIMITS`. Holds the monthly counters
# and the per-IP windows; nothing in it is worth reading.
[[kv_namespaces]]
binding = "LIMITS"
id = "77d0eede826e41459f52126bfeaa64b5"

[observability]
enabled = true
